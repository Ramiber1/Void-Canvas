<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Canvas - VHS Glitch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #011705;
            font-family: monospace;
            user-select: none;
        }

        /* Container CRT / Broken Screen Effect */
        .crt-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Overlay VHS Scanlines & Vignette */
        .vhs-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                radial-gradient(circle at center, transparent 60%, rgba(0, 10, 2, 0.85) 100%);
            background-size: 100% 4px, 100% 100%;
            z-index: 10;
        }

        /* Glass / CRT Screen Distortion Crack Borders */
        .crt-glass {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0, 255, 64, 0.15);
            border: 2px solid rgba(13, 66, 18, 0.4);
            z-index: 11;
        }

        /* Subtle Static Flicker */
        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            52% { opacity: 0.92; }
            54% { opacity: 1; }
            80% { opacity: 0.96; }
            100% { opacity: 0.99; }
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
        }

        /* Glitch animations for UI elements */
        .glitch-text {
            text-shadow: 2px 0 #00ff41, -2px 0 #ff0055;
        }
    </style>
</head>
<body class="crt-flicker">
    <div class="crt-container">
        <canvas id="spaceCanvas"></canvas>
        <div class="vhs-overlay"></div>
        <div class="crt-glass"></div>

        <!-- HUD Controls -->
        <div class="absolute top-4 left-4 z-20 text-green-500 bg-black/70 p-4 rounded border border-green-900/80 backdrop-blur max-w-xs shadow-lg shadow-green-950/50">
            <h1 class="text-lg font-bold tracking-widest text-green-400 glitch-text uppercase mb-1">// SYSTEM_VOID v0.9</h1>
            <p class="text-xs text-green-600 mb-3">Arraste para navegar • Scroll para Zoom</p>
            
            <div id="inspector" class="hidden border-t border-green-900/60 pt-3 mt-2">
                <p class="text-xs text-green-400 font-bold mb-2">PROPRIEDADES DO BLOCO:</p>
                <label class="block text-xs text-green-600 mb-1">Mudar Texto:</label>
                <select id="textSelector" class="w-full bg-green-950 text-green-300 border border-green-800 rounded p-1 text-xs mb-2 outline-none focus:border-green-500">
                    <option value="Listen.">Listen.</option>
                    <option value="Not to be.">Not to be.</option>
                    <option value="That one">That one</option>
                    <option value="SECRET_BINARY">01010100 01101000...</option>
                </select>
                <button id="btnDelete" class="w-full bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-800 rounded p-1 text-xs transition">Destruir Bloco</button>
            </div>
        </div>

        <!-- Floating Coordinates HUD -->
        <div class="absolute bottom-4 left-4 z-20 text-green-700/80 text-xs tracking-wider">
            POS_X: <span id="posX">0</span> | POS_Y: <span id="posY">0</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        // Secret Strings
        const BINARY_TEXT = "01010100 01101000 01100101 00100000 01110000 01101100 01100001 01101001 01110011 00100000 01110100 01101000 01100001 01110100 00100000 01101001 01110011 00100000 01110100 01101000 01100001 01110100";
        const MORSE_TEXT = ".... - - .--. ... -..-. -..-. -.-- --- ..- - ..- .-.-.- -... . -..-. --.- --- .-.. -.-- ....- .--- .-.. -..- -..- --.. ... ..--.. ... .. ..-. . .--. -- -....- -. -.-. .-. ---.. - ..--- --- .. ...- ..-. -....-";

        const STANDARD_TEXTS = ["Listen.", "Not to be.", "That one"];

        // State & Camera
        let camera = { x: 0, y: 0, zoom: 1 };
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };
        let velocity = { x: 0, y: 0 };
        let selectedBlock = null;

        // Resize Canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Initial Blocks
        const blocks = [
            { id: 1, x: -200, y: -100, width: 220, height: 110, text: "Listen." },
            { id: 2, x: 300, y: 150, width: 220, height: 110, text: "Not to be." },
            { id: 3, x: -150, y: 350, width: 220, height: 110, text: "That one" },
            // Isolated Secret Morse Block (No shortcut button)
            { id: 999, x: 4800, y: -3600, width: 340, height: 160, text: MORSE_TEXT, isSecret: true }
        ];

        // Background Gradient
        function drawBackground() {
            const grad = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 100,
                canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height)
            );
            grad.addColorStop(0, '#05280c');
            grad.addColorStop(1, '#011705');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Render Cards/Cubes
        function drawBlock(block) {
            // World to Screen
            const screenX = (block.x - camera.x) * camera.zoom + canvas.width / 2;
            const screenY = (block.y - camera.y) * camera.zoom + canvas.height / 2;
            const screenW = block.width * camera.zoom;
            const screenH = block.height * camera.zoom;

            // Frustum Culling
            if (screenX + screenW < 0 || screenX > canvas.width || screenY + screenH < 0 || screenY > canvas.height) return;

            ctx.save();
            
            // Card Shadow
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 15 * camera.zoom;
            ctx.shadowOffsetY = 6 * camera.zoom;

            // Main Box (#0d4212 style)
            ctx.fillStyle = block === selectedBlock ? '#135c1a' : '#0d4212';
            ctx.strokeStyle = block === selectedBlock ? '#00ff41' : '#06260a';
            ctx.lineWidth = Math.max(1, 3 * camera.zoom);

            const radius = 12 * camera.zoom;
            ctx.beginPath();
            ctx.roundRect(screenX, screenY, screenW, screenH, radius);
            ctx.fill();
            ctx.stroke();

            // Inner Shadow / Border Detail
            ctx.shadowColor = 'transparent';
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.lineWidth = Math.max(1, 1.5 * camera.zoom);
            ctx.strokeRect(screenX + 3 * camera.zoom, screenY + 3 * camera.zoom, screenW - 6 * camera.zoom, screenH - 6 * camera.zoom);

            // Draw Main Text
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            let fontSize = Math.max(8, 22 * camera.zoom);
            if (block.text.length > 20) fontSize = Math.max(6, 11 * camera.zoom);
            if (block.text.length > 80) fontSize = Math.max(5, 8 * camera.zoom);

            ctx.font = `bold ${fontSize}px monospace`;

            // Wrap Text if Binary or Morse
            if (block.text.length > 30) {
                const words = block.text.split(' ');
                let line = '';
                let lines = [];
                for (let n = 0; n < words.length; n++) {
                    let testLine = line + words[n] + ' ';
                    let metrics = ctx.measureText(testLine);
                    if (metrics.width > screenW - 20 * camera.zoom && n > 0) {
                        lines.push(line);
                        line = words[n] + ' ';
                    } else {
                        line = testLine;
                    }
                }
                lines.push(line);

                const startY = screenY + (screenH / 2) - ((lines.length - 1) * fontSize * 0.6) - (8 * camera.zoom);
                lines.forEach((l, i) => {
                    ctx.fillText(l.trim(), screenX + screenW / 2, startY + (i * fontSize * 1.2));
                });
            } else {
                ctx.fillText(block.text, screenX + screenW / 2, screenY + screenH / 2 - (8 * camera.zoom));
            }

            // Subtitle "RUN."
            ctx.fillStyle = '#06290b';
            ctx.font = `bold ${Math.max(6, 14 * camera.zoom)}px monospace`;
            ctx.fillText("RUN.", screenX + screenW / 2, screenY + screenH - (18 * camera.zoom));

            ctx.restore();
        }

        // Glitch FX Overlay on Canvas
        function applyGlitchFX() {
            if (Math.random() < 0.15) {
                const y = Math.random() * canvas.height;
                const h = Math.random() * 20 + 2;
                const slice = ctx.getImageData(0, y, canvas.width, h);
                const offset = (Math.random() - 0.5) * 15;
                ctx.putImageData(slice, offset, y);
            }
        }

        // Main Loop
        function render() {
            // Apply Physics Inertia
            if (!isDragging) {
                camera.x += velocity.x;
                camera.y += velocity.y;
                velocity.x *= 0.92;
                velocity.y *= 0.92;
            }

            drawBackground();
            blocks.forEach(drawBlock);
            applyGlitchFX();

            document.getElementById('posX').innerText = Math.round(camera.x);
            document.getElementById('posY').innerText = Math.round(camera.y);

            requestAnimationFrame(render);
        }

        // Interactions
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouse = { x: e.clientX, y: e.clientY };
            
            // Selection Check
            const mouseWorldX = (e.clientX - canvas.width / 2) / camera.zoom + camera.x;
            const mouseWorldY = (e.clientY - canvas.height / 2) / camera.zoom + camera.y;

            selectedBlock = blocks.slice().reverse().find(b => 
                mouseWorldX >= b.x && mouseWorldX <= b.x + b.width &&
                mouseWorldY >= b.y && mouseWorldY <= b.y + b.height
            ) || null;

            const inspector = document.getElementById('inspector');
            const selector = document.getElementById('textSelector');
            if (selectedBlock && !selectedBlock.isSecret) {
                inspector.classList.remove('hidden');
                selector.value = selectedBlock.text === BINARY_TEXT ? 'SECRET_BINARY' : selectedBlock.text;
            } else {
                inspector.classList.add('hidden');
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastMouse.x;
            const dy = e.clientY - lastMouse.y;
            velocity = { x: -dx / camera.zoom, y: -dy / camera.zoom };
            camera.x += velocity.x;
            camera.y += velocity.y;
            lastMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            camera.zoom = Math.min(Math.max(0.15, camera.zoom * zoomFactor), 3);
        }, { passive: false });

        // Double Click to Spawn
        canvas.addEventListener('dblclick', (e) => {
            const worldX = (e.clientX - canvas.width / 2) / camera.zoom + camera.x;
            const worldY = (e.clientY - canvas.height / 2) / camera.zoom + camera.y;
            const randomTxt = STANDARD_TEXTS[Math.floor(Math.random() * STANDARD_TEXTS.length)];
            
            blocks.push({
                id: Date.now(),
                x: worldX - 110,
                y: worldY - 55,
                width: 220,
                height: 110,
                text: randomTxt
            });
        });

        // Property Editors
        document.getElementById('textSelector').addEventListener('change', (e) => {
            if (selectedBlock && !selectedBlock.isSecret) {
                selectedBlock.text = e.target.value === 'SECRET_BINARY' ? BINARY_TEXT : e.target.value;
            }
        });

        document.getElementById('btnDelete').addEventListener('click', () => {
            if (selectedBlock && !selectedBlock.isSecret) {
                const idx = blocks.indexOf(selectedBlock);
                if (idx > -1) blocks.splice(idx, 1);
                selectedBlock = null;
                document.getElementById('inspector').classList.add('hidden');
            }
        });

        render();
    </script>
</body>
</html>
